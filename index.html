<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07040b" />
    <title>RESCUE: Lanterns of Yomi</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='11' y='3' width='10' height='3' fill='%233a1f12'/><ellipse cx='16' cy='16' rx='10' ry='11' fill='%23f6c35b'/><circle cx='16' cy='15' r='4' fill='white'/><circle cx='16' cy='15' r='2' fill='black'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet" />

      html, body { margin: 0; height: 100%; background: #07040b; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }

        display: none; position: fixed; inset: 0; z-index: 10; background: #07040b; color: #ffe9a8;
        font: 20px 'DotGothic16', monospace; align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }

  <body>
    <div id="game"></div>
    <div id="rotate">Gira tu dispositivo a horizontal<br />para guiar a Akari 🏮</div>
